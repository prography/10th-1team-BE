server:
  port: 8080

spring:
  config:
    import: optional:file:./prography-bff/.env[.properties]

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/mydb_local}
    elasticsearch:
      host: ${ELASTICSEARCH_HOST:localhost}
      port: ${ELASTICSEARCH_PORT:9200}
      user: ${ELASTICSEARCH_USER:elastic}
      password: ${ELASTICSEARCH_PASSWORD:changeme}
      ssl:
        enable: ${ELASTICSEARCH_SSL_ENABLE:true}
        # 운영 환경에서 인증서 관련해서 신경쓰지 않기 위해선 true 설정
        trust-all: ${ELASTICSEARCH_SSL_TRUST_ALL:false}
      repositories:
        enabled: false

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myapp_local}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: NEVER

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-secret: ${KAKAO_CLIENT_SECRET}

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}